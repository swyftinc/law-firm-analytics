name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Skills are built from src and valid
        run: python3 tools/build.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: No em dashes in docs or skills
        run: |
          if grep -rIl $'\xe2\x80\x94' --include='*.md' --include='*.py' --include='*.json' --include='*.yml' . ; then
            echo "Found an em dash"; exit 1
          fi
